services:
  postgres:
    image: postgres:17-alpine
    container_name: relay-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay_os
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_password
    ports:
      - "5432:5432"
    volumes:
      - relay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relay_postgres_data: